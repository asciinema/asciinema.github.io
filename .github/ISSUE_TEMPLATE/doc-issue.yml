name: Documentation Issue
description: Report an error or problem on docs.asciinema.org
body:
  - type: markdown
    attributes:
      value: |
        **This is a tracker for issues with the asciinema documentation site (docs.asciinema.org).**

        - If you found a bug in the software itself, please open an issue in the relevant repository (CLI, player, server, agg, avt)
        - For feature requests, questions, and discussions, use the [forum](https://discourse.asciinema.org) or [GitHub discussions](https://github.com/orgs/asciinema/discussions)

        Thanks for helping improve the documentation! Please fill out the sections below.

  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission checks
      description: Please confirm the following before submitting
      options:
        - label: I have searched existing issues and this problem has not been reported yet
          required: true

  - type: input
    id: page-url
    attributes:
      label: Page URL
      description: Link to the documentation page with the problem
      placeholder: e.g., https://docs.asciinema.org/manual/cli/quick-start/
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What is wrong?
      description: Incorrect information, outdated instructions, broken link, rendering problem, etc.
    validations:
      required: true

  - type: textarea
    id: suggested-fix
    attributes:
      label: Suggested Fix
      description: If you know what the content should say instead, tell us here. Small fixes are also welcome directly as pull requests.

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Add any other context or screenshots here.
